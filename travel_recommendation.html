
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Recommendation</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
      }

      nav {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        padding: 1rem 2rem;
        background: #f3f6f7;
      }

      nav ul {
        display: flex;
        gap: 1.25rem;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      nav a {
        color: #173b3b;
        text-decoration: none;
      }

      .search-form {
        display: flex;
        gap: 0.5rem;
      }

      .search-form input {
        min-width: 14rem;
        padding: 0.6rem;
      }

      .search-form button {
        padding: 0.6rem 0.9rem;
        cursor: pointer;
      }

      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      main {
        padding: 1rem 2rem;
      }

      #search-results {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(16rem, 1fr));
        gap: 1rem;
      }

      .search-result {
        padding: 1rem;
        border: 1px solid #d5dddd;
        border-radius: 0.5rem;
      }

      .search-result img {
        display: block;
        width: 100%;
        aspect-ratio: 16 / 9;
        margin-bottom: 1rem;
        border-radius: 0.25rem;
        object-fit: cover;
      }

      .search-result h2 {
        margin-top: 0;
      }

      @media (max-width: 700px) {
        nav {
          align-items: stretch;
          flex-direction: column;
          padding: 1rem;
        }

        .search-form input {
          min-width: 0;
          flex: 1;
        }
      }
    </style>
    <script src="travel_recommendation.js" defer></script>
  </head>
  <body>
    <nav aria-label="Main navigation">
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="travel_recommendation.html">Explore</a></li>
        <li><a href="contact.html">Contact Us</a></li>
      </ul>
      <form class="search-form" id="search-form" role="search">
        <label for="search-input" class="visually-hidden">Search destinations</label>
        <input id="search-input" name="query" type="search" placeholder="Search destinations..." autocomplete="off">
        <button type="submit">Search</button>
        <button type="reset">Clear</button>
      </form>
    </nav>
    <main>
      <p id="search-status" aria-live="polite"></p>
      <section id="search-results" aria-label="Search results"></section>
    </main>
  </body>
</html>
