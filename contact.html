<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Get in touch with the Travel Recommendation team.">
    <title>Contact Us | Travel Recommendation</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        color: #fff;
        font-family: Arial, sans-serif;
        background:
          linear-gradient(110deg, rgb(8 28 31 / 88%), rgb(8 28 31 / 65%)),
          url("https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=2200&q=85")
            center / cover fixed;
      }

      nav {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1.5rem;
        padding: 1rem 5vw;
        background: rgb(8 28 31 / 55%);
      }

      .brand {
        color: #fff;
        font-size: 1.15rem;
        font-weight: 700;
        text-decoration: none;
      }

      nav ul {
        display: flex;
        gap: 1.25rem;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      nav a {
        color: #fff;
        text-decoration: none;
      }

      nav a:hover,
      nav a:focus-visible {
        text-decoration: underline;
        text-underline-offset: 0.25em;
      }

      .search-form {
        display: flex;
        gap: 0.4rem;
      }

      .search-form input,
      .search-form button {
        padding: 0.6rem 0.7rem;
        border: 0;
        border-radius: 0.25rem;
        font: inherit;
      }

      .search-form input {
        min-width: 11rem;
      }

      .search-form button {
        cursor: pointer;
      }

      .search-form button[type="submit"],
      .contact-form button {
        background: #d7a85b;
        color: #142a29;
        font-weight: 700;
      }

      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      main {
        max-width: 900px;
        margin: 0 auto;
        padding: 3rem 2rem 4rem;
      }

      .eyebrow {
        margin: 0 0 0.75rem;
        color: #b8e4d6;
        font-size: 0.85rem;
        font-weight: 700;
        letter-spacing: 0.15em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0 0 0.75rem;
        font-size: clamp(2.5rem, 6vw, 4rem);
      }

      .intro {
        margin: 0 0 2rem;
        font-size: 1.1rem;
        line-height: 1.6;
      }

      .contact-form {
        display: grid;
        gap: 1rem;
        max-width: 38rem;
        padding: 1.5rem;
        border: 1px solid rgb(255 255 255 / 28%);
        border-radius: 0.5rem;
        background: rgb(8 28 31 / 72%);
      }

      .contact-form label {
        display: grid;
        gap: 0.4rem;
        font-weight: 700;
      }

      .contact-form input,
      .contact-form textarea {
        width: 100%;
        padding: 0.75rem;
        border: 1px solid #c7d0cd;
        border-radius: 0.25rem;
        font: inherit;
      }

      .contact-form textarea {
        min-height: 9rem;
        resize: vertical;
      }

      .contact-form button {
        justify-self: start;
        padding: 0.8rem 1.2rem;
        border: 0;
        border-radius: 0.25rem;
        cursor: pointer;
        font: inherit;
      }

      #form-status {
        margin: 0;
        line-height: 1.5;
      }

      #search-status {
        margin: 1.5rem 0;
      }

      #search-results {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(15rem, 1fr));
        gap: 1rem;
      }

      .search-result {
        padding: 1rem;
        border: 1px solid rgb(255 255 255 / 28%);
        border-radius: 0.5rem;
        background: rgb(8 28 31 / 72%);
      }

      @media (max-width: 850px) {
        nav {
          align-items: flex-start;
          flex-direction: column;
        }

        .search-form {
          width: 100%;
        }

        .search-form input {
          min-width: 0;
          flex: 1;
        }
      }

      @media (max-width: 600px) {
        nav ul {
          flex-wrap: wrap;
          gap: 0.75rem 1rem;
        }

        main {
          padding: 2rem 1.25rem 3rem;
        }

        .contact-form {
          padding: 1rem;
        }
      }
    </style>
    <script src="travel_recommendation.js" defer></script>
  </head>
  <body>
    <nav aria-label="Main navigation">
      <a class="brand" href="index.html">Travel Recommendation</a>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About Us</a></li>
        <li><a href="travel_recommendation.html">Explore</a></li>
        <li><a href="contact.html" aria-current="page">Contact Us</a></li>
      </ul>
      <form class="search-form" id="search-form" role="search">
        <label for="search-input" class="visually-hidden">Search destinations</label>
        <input id="search-input" name="query" type="search" placeholder="Search destinations..." autocomplete="off">
        <button type="submit">Search</button>
        <button type="reset">Clear</button>
      </form>
    </nav>
    <main>
      <p id="search-status" aria-live="polite"></p>
      <section id="search-results" aria-label="Search results"></section>
      <section aria-labelledby="contact-title">
        <p class="eyebrow">We'd love to hear from you</p>
        <h1 id="contact-title">Contact Us</h1>
        <p class="intro">Have a question or travel idea? Send our team a message.</p>
        <form class="contact-form" id="contact-form">
          <label for="contact-name">
            Name
            <input id="contact-name" name="name" type="text" autocomplete="name" required>
          </label>
          <label for="contact-email">
            Email
            <input id="contact-email" name="email" type="email" autocomplete="email" required>
          </label>
          <label for="contact-message">
            Message
            <textarea id="contact-message" name="message" rows="6" required></textarea>
          </label>
          <button type="submit">Submit</button>
          <p id="form-status" role="status"></p>
        </form>
      </section>
    </main>
    <script>
      document.querySelector("#contact-form").addEventListener("submit", (event) => {
        event.preventDefault();
        document.querySelector("#form-status").textContent =
          "Thanks for reaching out. Message delivery is not configured on this demo yet.";
      });
    </script>
  </body>
</html>
