<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Discover inspiring destinations and find your next travel recommendation.">
    <title>Travel Recommendation | Discover your next trip</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        color: #fff;
        font-family: Arial, sans-serif;
        background:
          linear-gradient(90deg, rgb(8 28 31 / 78%), rgb(8 28 31 / 22%)),
          url("https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=2200&q=85")
            center / cover fixed;
      }

      nav {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1.5rem;
        padding: 1.25rem 6vw;
        background: rgb(8 28 31 / 55%);
      }

      .brand {
        color: #fff;
        font-size: 1.2rem;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-decoration: none;
      }

      nav ul {
        display: flex;
        gap: 1.5rem;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .search-form {
        display: flex;
        gap: 0.5rem;
      }

      .search-form input,
      .search-form button {
        padding: 0.6rem 0.75rem;
        border: 0;
        border-radius: 0.25rem;
        font: inherit;
      }

      .search-form input {
        min-width: 12rem;
      }

      .search-form button {
        cursor: pointer;
      }

      .search-form button[type="submit"] {
        background: #d7a85b;
        color: #142a29;
        font-weight: 700;
      }

      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      nav a {
        color: #fff;
        text-decoration: none;
      }

      nav a:hover,
      nav a:focus-visible {
        text-decoration: underline;
        text-underline-offset: 0.25em;
      }

      main {
        display: flex;
        align-items: center;
        min-height: calc(100vh - 4.5rem);
        flex-wrap: wrap;
        gap: 2rem;
        padding: 4rem 10vw;
      }

      .introduction {
        max-width: 42rem;
      }

      #search-status,
      #search-results {
        flex-basis: 100%;
      }

      #search-results {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(16rem, 1fr));
        gap: 1rem;
      }

      .search-result {
        padding: 1rem;
        border: 1px solid rgb(255 255 255 / 35%);
        border-radius: 0.5rem;
        background: rgb(8 28 31 / 70%);
      }

      .search-result img {
        display: block;
        width: 100%;
        aspect-ratio: 16 / 9;
        margin-bottom: 1rem;
        border-radius: 0.25rem;
        object-fit: cover;
      }

      .search-result h2 {
        margin-top: 0;
      }

      .eyebrow {
        margin: 0 0 1rem;
        color: #b8e4d6;
        font-size: 0.85rem;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(2.75rem, 7vw, 5.5rem);
        line-height: 1.05;
      }

      .introduction p:not(.eyebrow) {
        max-width: 36rem;
        margin: 1.5rem 0 2rem;
        font-size: clamp(1.05rem, 2vw, 1.25rem);
        line-height: 1.7;
      }

      .explore-link {
        display: inline-block;
        padding: 0.9rem 1.3rem;
        border-radius: 0.35rem;
        background: #d7a85b;
        color: #142a29;
        font-weight: 700;
        text-decoration: none;
      }

      .explore-link:hover,
      .explore-link:focus-visible {
        background: #efc579;
      }

      @media (max-width: 600px) {
        nav {
          align-items: flex-start;
          flex-direction: column;
          gap: 1rem;
        }

        .search-form {
          width: 100%;
        }

        .search-form input {
          min-width: 0;
          flex: 1;
        }

        nav ul {
          flex-wrap: wrap;
          gap: 1rem;
        }

        main {
          min-height: calc(100vh - 7rem);
          padding: 3rem 7vw;
        }
      }
    </style>
    <script src="travel_recommendation.js" defer></script>
  </head>
  <body>
    <nav aria-label="Main navigation">
      <a class="brand" href="index.html">Travel Recommendation</a>
      <ul>
        <li><a href="index.html" aria-current="page">Home</a></li>
        <li><a href="about.html">About Us</a></li>
        <li><a href="contact.html">Contact Us</a></li>
      </ul>
      <form class="search-form" id="search-form" role="search">
        <label for="search-input" class="visually-hidden">Search destinations</label>
        <input id="search-input" name="query" type="search" placeholder="Search destinations..." autocomplete="off">
        <button type="submit">Search</button>
        <button type="reset">Clear</button>
      </form>
    </nav>
    <main>
      <p id="search-status" aria-live="polite"></p>
      <section id="search-results" aria-label="Search results"></section>
      <section class="introduction" aria-labelledby="intro-title">
        <p class="eyebrow">The world is waiting</p>
        <h1 id="intro-title">Find a place that moves you.</h1>
        <p>
          From sunlit beaches and ancient temples to vibrant cities, discover
          travel inspiration for your next unforgettable adventure.
        </p>
        <a class="explore-link" href="travel_recommendation.html">Explore destinations</a>
      </section>
    </main>
  </body>
</html>
